name: Docker

on:
  workflow_call:

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: setup Docker Build
      uses: docker/setup-buildx-action@v2.0.0

    - name: Download a Build Artifact
    # Do repositório indicado no Marketplace do GitHub Actions
      uses: actions/download-artifact@v4
      with:
        name: programa-go

    - name: Docker Login
    # Do repositório indicado no Marketplace do GitHub Actions
      uses: docker/login-action@v4.0.0
      with:
        username: moiseslcar
        password: ${{ secrets.PASSWORD_DOCKER_HUB }}
   
    - name: Build and Push Docker images
    # Do repositório indicado no Marketplace do GitHub Actions
      uses: docker/build-push-action@v3.0.0  
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: moiseslcar/go-ci:${{ github.ref_name }} # Recomendado usar "${{ github.sha }}" para garantir unicidade, mas aqui usamos a tag da branch para facilitar testes