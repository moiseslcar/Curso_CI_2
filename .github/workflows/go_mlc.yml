name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env: # Variáveis de ambiente para a conexão com o banco de dados
      HOST: localhost
      USER: root
      PASSWORD: root
      DBNAME: root
      PORT: 5432
    strategy:
      matrix:
        go_version: ['1.22']
        os: ['ubuntu-latest', 'ubuntu-22.04']
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}
        cache: true # Ativa o cache de dependências Go automaticamente

    - name: Build-DB
      run: docker compose up -d # O 'up' já engloba o build se necessário

    - name: Check Docker Status
      run: docker compose ps
      
    - name: Wait for Database
      run: |
        echo "Aguardando o PostgreSQL ficar pronto..."
        # Este comando inspeciona o container até que o status mude para 'healthy'
        # É muito mais rápido que um 'sleep' fixo
        until [ "$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q postgres))" == "healthy" ]; do
          echo "Ainda iniciando... (2s)"
          sleep 2
        done
        echo "✓ Banco de dados pronto para testes!"

    - name: Test
      run: go test -v main_test.go 

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: true
    - name: Build
      run: go build -v main.go

    - name: Upload a Build Artifact
    # Do repositório indicado no Marketplace do GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: programa-go
        path: main


  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit # Permite que os segredos sejam passados para o workflow chamado